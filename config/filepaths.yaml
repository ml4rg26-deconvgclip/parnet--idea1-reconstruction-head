# ── Pretrained PARNET backbone ───────────────────────────────────────────────
models:
  parnet.7m-0.0: "../../extra/parnet.7m-0.0.pt"

# ── GlobalCLIP datasets (pt.gz) ──────────────────────────────────────────────
# All three GlobalCLIP files share the same regions and the same globalCLIP
# signal, but differ in which biological control track is included.
#   lysate_noNHS  : free-RNA baseline (cleanest background)
#   interphase    : interphase pellet — proteins+RNA complexes + some free RNA
#   lysate        : Lysate_NHS pull-down (proteins saturate beads, noisiest)
#
# Recommendation: train with lysate_noNHS as the primary control.
data:
  # eCLIP 223-track file (same regions, used to inspect RBP metadata only)
  eclip:
    pt:  "../../extra/600nt_globalCLIP_synchronized_datasets-20260617T101019Z-3-001/600nt_globalCLIP_synchronized_datasets/eCLIP_600bp_signalfiltered.pt.gz"
    meta: "../../extra/600nt_globalCLIP_synchronized_datasets-20260617T101019Z-3-001/600nt_globalCLIP_synchronized_datasets/eCLIP_600bp_signalfiltered.metadata.yaml"
    rbp_tsv: "../../extra/600nt_globalCLIP_synchronized_datasets-20260617T101019Z-3-001/600nt_globalCLIP_synchronized_datasets/eCLIP_600bp_signalfiltered.rbp_cts.tsv"

  # GlobalCLIP datasets
  globalclip_lysate_noNHS:
    pt:   "../../extra/600nt_globalCLIP_synchronized_datasets-20260617T101019Z-3-001/600nt_globalCLIP_synchronized_datasets/globalclip_lysate_noNHS_600bp_signalfiltered.pt.gz"
    meta: "../../extra/600nt_globalCLIP_synchronized_datasets-20260617T101019Z-3-001/600nt_globalCLIP_synchronized_datasets/globalclip_lysate_noNHS_600bp_signalfiltered.metadata.yaml"

  globalclip_interphase:
    pt:   "../../extra/600nt_globalCLIP_synchronized_datasets-20260617T101019Z-3-001/600nt_globalCLIP_synchronized_datasets/globalclip_interphase_600bp_signalfiltered.pt.gz"
    meta: "../../extra/600nt_globalCLIP_synchronized_datasets-20260617T101019Z-3-001/600nt_globalCLIP_synchronized_datasets/globalclip_interphase_600bp_signalfiltered.metadata.yaml"

  globalclip_lysate:
    pt:   "../../extra/600nt_globalCLIP_synchronized_datasets-20260617T101019Z-3-001/600nt_globalCLIP_synchronized_datasets/globalclip_lysate_600bp_signalfiltered.pt.gz"
    meta: "../../extra/600nt_globalCLIP_synchronized_datasets-20260617T101019Z-3-001/600nt_globalCLIP_synchronized_datasets/globalclip_lysate_600bp_signalfiltered.metadata.yaml"

# ── Output directories ────────────────────────────────────────────────────────
results:
  standard_model: "results/globalclip/standard"
  qlayer_model:   "results/globalclip/qlayer"
  analysis:       "results/globalclip/analysis"

# ── Metadata ─────────────────────────────────────────────────────────────────
metadata:
  full_rbp_set: "../../extra/600nt_globalCLIP_synchronized_datasets-20260617T101019Z-3-001/600nt_globalCLIP_synchronized_datasets/eCLIP_600bp_signalfiltered.rbp_cts.tsv"
