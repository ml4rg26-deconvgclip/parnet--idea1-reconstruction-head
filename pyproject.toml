[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parnet-demo-train-models"
version = "0.1.0"
description = "GlobalCLIP CombiLayer: combining PARNET RBP tracks to predict GlobalCLIP signal."
requires-python = ">=3.10,<3.11"
authors = [{ name = "MLG Project" }]
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
indent-width = 4
