[feature.jupyter.pypi-dependencies]

igv-notebook = { git = "git+https://github.com/igvteam/igv-notebook.git", rev = "2995132" }

# ===============================================================

[feature.parnet-all.dependencies]

captum = ">=0.7.0,<0.8"
gin-config = "==0.5.0"
datasets = ">=3.6.0,<4.0.0"
lightning = ">=2.3,<2.6"
lightning-utilities = ">=0.14,<0.15"
transformers = ">=4.40,<5"
torchmetrics = ">=1.8.2,<2"

# ===============================================================

[feature.parnet-cpu.dependencies]

python = ">=3.10,<3.11"
pytorch-cpu = "==2.5.1"

[feature.parnet-cpu.pypi-dependencies]

tensorflow = { version = ">=2.16,<2.17" }
parnet = { git = "git+https://github.com/lambosaur/parnet.git", rev = "2e14278" }

# ===============================================================

[feature.parnet-gpu-cu11]

platforms = ["linux-64"]
# NOTE: required for correct package resolution;
# this is NOT probing the host system, but a constraint for the solver.
system-requirements = { cuda = "11.8" }

[feature.parnet-gpu-cu11.dependencies]

cuda-version = "11.8.*"
cudatoolkit = "11.8.*"
pytorch-gpu = { version = "==2.5.1", channel = "conda-forge" }
cupy = ">=13.6.0,<14"

[feature.parnet-gpu-cu11.pypi-dependencies]

tensorflow = { version = ">=2.16,<2.17", extras = ["and-cuda"] }
parnet = { git = "git+https://github.com/lambosaur/parnet.git", rev = "2e14278", extras = [
    "gpu",
] }

nx-cugraph-cu11 = "==25.6.0"
cudf-cu11 = ">=25.0,<26.0"
cuml-cu11 = ">=25.0,<26.0"

# ===============================================================

[feature.parnet-gpu-cu12]

platforms = ["linux-64"]
# CUDA 12.8 driver requirement; system driver (13.2) is backward-compatible.
# PyTorch is installed from the official PyTorch CUDA 12.8 wheel index (PyPI)
# to avoid the conda-forge triton↔Python-3.10↔GCC-15 conflict.
system-requirements = { cuda = "12.8" }

[feature.parnet-gpu-cu12.dependencies]
python = ">=3.10,<3.11"
# cuda-version pins conda CUDA libs for cupy; no pytorch-gpu (installed via PyPI below).
cuda-version = "12.8.*"
cupy = ">=13.6.0,<14"
datasets = ">=3.6.0,<4.0.0"
transformers = ">=4.40"
gin-config = "==0.5.0"

[feature.parnet-gpu-cu12.pypi-options]

# Use the PyTorch CUDA 12.8 index as primary so torch resolves to the GPU wheel.
# All other packages (captum, lightning, etc.) fall back to standard PyPI.
index-url = "https://download.pytorch.org/whl/cu128"
extra-index-urls = ["https://pypi.org/simple"]

[feature.parnet-gpu-cu12.pypi-dependencies]

# PyTorch GPU — resolved from index-url above (CUDA 12.8 wheel).
torch = ">=2.6.0"

# Packages that are conda deps in parnet-all but need to be PyPI here to avoid
# conda-forge captum/torchmetrics pulling in a conda pytorch (which would conflict
# with the PyPI torch). parnet-all is excluded from parnet-dev-cu12 for this reason.
# datasets is installed via conda (above) to avoid dill/pyarrow conda pin conflicts.
captum = ">=0.7.0,<0.8"
lightning = ">=2.3,<2.6"
lightning-utilities = ">=0.14,<0.15"
torchmetrics = ">=1.8.2,<2"

# TF runs CPU-only here: torch CUDA + tensorflow[and-cuda] both pin nvidia-cublas-cu12
# at conflicting versions and cannot coexist in the same PyPI environment.
tensorflow = { version = ">=2.16,<2.17" }
parnet = { git = "git+https://github.com/lambosaur/parnet.git", rev = "dev" }

# cudf <25.10 needs pyarrow<20, but conda pins pyarrow==20.0.0.
# cudf >=25.10 requires exactly pyarrow==20.0.0 — matching the conda pin.
nx-cugraph-cu12 = ">=25.10.0,<26.0"
cudf-cu12 = ">=25.10.0,<26.0"
cuml-cu12 = ">=25.0,<26.0"

# ===============================================================

[feature.parnet-libs-git.pypi-dependencies]

pylbsr                  = { git = "git+https://github.com/lambosaur/pylbsr.git",                       rev = "main" }
parnet_analyses_libs    = { git = "git+https://github.com/parnet-project/parnet_analyses_libs.git",    rev = "main" }
parnet_additional_utils = { git = "git+https://github.com/parnet-project/parnet_additional_utils.git", rev = "main" }
metamotif               = { git = "git+https://github.com/lambosaur/metamotif.git", rev = "develop" }

# ===============================================================

[feature.parnet-libs-local.pypi-dependencies]

pylbsr                  = { path = "externals/pylbsr",                  editable = true }
parnet_analyses_libs    = { path = "externals/parnet_analyses_libs",    editable = true }
parnet_additional_utils = { path = "externals/parnet_additional_utils", editable = true }
metamotif               = { path = "externals/metamotif",               editable = true }

